name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21 (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run full verification suite
        run: pnpm ci:verify

  deploy:
    name: Deploy to Firebase
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check deployment secrets
        id: secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Firebase deployment because FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID secret is not configured yet (complete Step M0.8 to enable production deploys)."
          fi

      - name: Checkout repository
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.secrets.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Firebase CLI
        if: steps.secrets.outputs.configured == 'true'
        run: npm install -g firebase-tools

      - name: Build production bundles
        if: steps.secrets.outputs.configured == 'true'
        env:
          VITE_AUTH_MODE: workos
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          VITE_WORKOS_API_HOSTNAME: ${{ secrets.VITE_WORKOS_API_HOSTNAME }}
          VITE_WORKOS_PERSIST_SESSION: ${{ vars.VITE_WORKOS_PERSIST_SESSION }}
        run: |
          pnpm --filter @agent-kanban/shared build
          pnpm --filter @agent-kanban/api build
          pnpm --filter @agent-kanban/web build

      - name: Prepare Cloud Functions deployment manifest and runtime env
        if: steps.secrets.outputs.configured == 'true'
        env:
          HOUSEHOLD_TIMEZONE: ${{ secrets.HOUSEHOLD_TIMEZONE }}
          WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          WORKOS_JWKS_URL: ${{ secrets.WORKOS_JWKS_URL }}
          WORKOS_ISSUER: ${{ secrets.WORKOS_ISSUER }}
          AUTO_ARCHIVE_DAYS: ${{ secrets.AUTO_ARCHIVE_DAYS }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pkgPath = "apps/api/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            if (pkg.dependencies) {
              for (const key of Object.keys(pkg.dependencies)) {
                if (String(pkg.dependencies[key]).startsWith("workspace:")) {
                  delete pkg.dependencies[key];
                }
              }
            }
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            const envEntries = [
              ["AUTH_MODE", "workos"],
              ["HOUSEHOLD_TIMEZONE", process.env.HOUSEHOLD_TIMEZONE || "UTC"],
              ["WORKOS_CLIENT_ID", process.env.WORKOS_CLIENT_ID],
              ["WORKOS_JWKS_URL", process.env.WORKOS_JWKS_URL],
              ["WORKOS_ISSUER", process.env.WORKOS_ISSUER],
              ["AUTO_ARCHIVE_DAYS", process.env.AUTO_ARCHIVE_DAYS],
              ["BACKUP_BUCKET", process.env.BACKUP_BUCKET],
            ].filter(([, value]) => typeof value === "string" && value.trim().length > 0);

            const envContent = envEntries
              .map(([k, v]) => `${k}=${JSON.stringify(v.trim())}`)
              .join("\n") + "\n";
            fs.writeFileSync("apps/api/.env", envContent, { mode: 0o600 });
          '

      - name: Deploy Firestore, Storage, Functions, and Hosting
        if: steps.secrets.outputs.configured == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          CREDS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDS_FILE"
          chmod 600 "$CREDS_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDS_FILE"
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules,firestore:indexes,storage,functions,hosting \
            --non-interactive \
            --force

      - name: Cleanup temporary deployment files
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" apps/api/.env
